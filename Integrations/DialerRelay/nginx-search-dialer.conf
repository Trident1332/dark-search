# New HTTPS virtual host only; existing landing/otto and port-80 ACME stay in place.
limit_req_zone $binary_remote_addr zone=search_dialer_turn:1m rate=6r/m;
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sip.investigate.agency;
    ssl_certificate /etc/letsencrypt/live/sip.investigate.agency/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sip.investigate.agency/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 32k;
    client_body_timeout 5s;
    location = /search-dialer/route-check {
        if ($request_method != GET) { return 405; }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '{"ip":"$remote_addr"}';
    }
    location = /search-dialer/turn {
        limit_req zone=search_dialer_turn burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/run/search-dialer-relay/issuer.sock;
        proxy_http_version 1.1;
        proxy_set_header Host sip.investigate.agency;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection close;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_request_buffering on;
        proxy_buffering off;
    }
    location / { return 404; }
}
